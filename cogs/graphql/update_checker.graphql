query ($manga_ids: [Int], $anime_ids: [Int]) {
    anime: Page {
        media (id_in: $anime_ids, type: ANIME) {
            id
            nextAiringEpisode { airingAt }
            status
            startDate {
                year
                month
                day
            }
            title {
                english
                romaji
            }
        }
    }
    manga: Page {
        media (id_in: $manga_ids, type: MANGA) {
            id
            idMal
            chapters
            status
            startDate {
                year
                month
                day
            }
            title {
                english
                romaji
            }
        }
    }
}