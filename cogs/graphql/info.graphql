query ($id: Int, $search, String) {
	Media(id: $id, search: $search, type: ANIME) {
		coverImage {
			large
		}
		averageScore
		description(asHtml: false)
		startDate {
			day
			month
			year
		}
		title {
			english
			romaji
		}
		synonyms
		# Next airing returns NoneType if show is finished
		nextAiringEpisode {
			airingAt
		}
		status
	}
}
